[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph-mcp"
version = "1.3.0"
description = "Codebase knowledge graph MCP server — AST extraction, graph queries, community detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "ai", "codegraph", "knowledge-graph", "ast"]
dependencies = [
    "mcp>=1.0.0",
    "networkx>=3.0",
    "pymupdf>=1.24",
    "tree-sitter>=0.23.0",
]

[project.optional-dependencies]
leiden = [
    "graspologic>=3.3",
]
treesitter = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-swift",
    "tree-sitter-lua",
    "tree-sitter-kotlin",
]

[project.scripts]
codegraph-mcp = "codegraph.server:main"

[tool.hatch.build.targets.wheel]
packages = ["codegraph"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

# ── ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
